<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТОЧКА</title><style>body{margin:0;background:#0e1625;color:#eef3ff;font:16px system-ui}main{max-width:940px;margin:auto;padding:18px}button{background:#537cff;border:0;border-radius:10px;color:white;padding:12px;cursor:pointer}input{background:#263349;color:white;border:1px solid #48566d;border-radius:10px;padding:12px;min-width:0}section{background:#1a2536;border-radius:18px;padding:20px;margin:14px 0}#chat{height:48vh;overflow:auto;background:#101a2b;padding:10px;border-radius:12px}.msg{background:#2c3e54;border-radius:12px;padding:10px;margin:9px 0;overflow-wrap:anywhere}.own{background:#214a85;margin-left:18%}.msg small{display:block;opacity:.7}#rooms button,#members button{margin:4px}.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1}.error{color:#ffb0b0}#app{display:grid;grid-template-columns:1fr 2fr;gap:12px}@media(max-width:650px){#app{grid-template-columns:1fr}main{padding:10px}section{padding:14px}}</style><main><header class="row"><h1>● ТОЧКА</h1><button id="logout" class="hidden">Выйти</button></header><p>Чат сотрудников · подключение без прямых запросов к Supabase</p><section id="auth"><h2>Вход / регистрация</h2><div class="row"><input id="email" placeholder="Email" type="email"><input id="password" placeholder="Пароль" type="password"><input id="nickname" placeholder="Ваше имя"></div><p class="row"><button id="login">Войти</button><button id="signup">Регистрация</button></p></section><section id="setup" class="hidden"><h2>Мои команды</h2><div id="teams"></div><div id="joinbox" class="hidden"><p>Вас пригласили в команду</p><button id="join">Присоединиться</button></div><div class="row"><input id="teamname" placeholder="Название команды"><button id="create">Создать команду</button></div></section><div id="app" class="hidden"><section><h2 id="teamtitle"></h2><button id="copy">Скопировать приглашение</button><h3>Чаты</h3><div id="rooms"></div><h3>Сотрудники</h3><div id="members"></div><button id="notify">🔔 Уведомления</button></section><section><h2 id="roomtitle">Общий чат</h2><div id="chat"></div><form class="row" id="send"><input id="message" placeholder="Сообщение..." maxlength="4000" required><button>Отправить</button></form></section></div><p id="status" class="error" role="status"></p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const origin='https://tmumiyekzgafawxdwgxm.supabase.co';
const proxy=(input,init={})=>{const url=new URL(typeof input==='string'?input:input.url);if(url.origin!==origin)throw Error('Запрос к неизвестному серверу');return fetch('/.netlify/functions/gateway?path='+encodeURIComponent(url.pathname+url.search),init)};
const db=createClient(origin,'sb_publishable_xrQK9pXy3KTvazSmbHScGg_QvHyScNw',{global:{fetch:proxy},auth:{detectSessionInUrl:true}});
const $=id=>document.getElementById(id),show=(id,yes)=>$(id).classList.toggle('hidden',!yes),message=s=>$('status').textContent=s||'';
const invite=new URLSearchParams(location.search).get('invite');let me,team,room,names={},seen=new Map(),busy=false;
async function get(p){const {data,error}=await p;if(error)throw error;return data}
async function safe(fn){try{message('');await fn()}catch(e){message(e.message||String(e))}}
$('signup').onclick=()=>safe(async()=>{await get(db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{display_name:$('nickname').value.trim()}}}));message('Проверьте почту и подтвердите адрес, затем войдите')});
$('login').onclick=()=>safe(async()=>{await get(db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}));await refresh()});
$('logout').onclick=()=>safe(async()=>{await db.auth.signOut();location.reload()});
$('create').onclick=()=>safe(async()=>{const id=await get(db.rpc('create_team',{p_name:$('teamname').value.trim(),p_display_name:$('nickname').value.trim()||me.user_metadata?.display_name||'Сотрудник'}));await openTeam(id)});
$('join').onclick=()=>safe(async()=>{const id=await get(db.rpc('join_team',{p_token:invite,p_display_name:$('nickname').value.trim()||me.user_metadata?.display_name||'Сотрудник'}));history.replaceState({},'',location.pathname);await openTeam(id)});
$('copy').onclick=()=>safe(async()=>{const link=location.origin+location.pathname+'?invite='+team.invite_token;await navigator.clipboard.writeText(link);message('Ссылка скопирована')});
$('notify').onclick=async()=>{if(!('Notification'in window)){message('Уведомления не поддерживаются');return}const r=await Notification.requestPermission();message(r==='granted'?'Уведомления разрешены, пока страница открыта':'Уведомления не разрешены')};
$('send').onsubmit=e=>{e.preventDefault();safe(async()=>{const body=$('message').value.trim();if(!body)return;await get(db.from('messages').insert({room_id:room,sender_id:me.id,body}));$('message').value='';await messages()})};
async function refresh(){me=(await db.auth.getUser()).data.user;show('auth',!me);show('setup',!!me);show('logout',!!me);show('joinbox',!!me&&!!invite);if(!me)return;const list=await get(db.from('members').select('team_id,teams(name)').eq('user_id',me.id));$('teams').replaceChildren();for(const item of list){const b=document.createElement('button');b.textContent=item.teams?.name||'Команда';b.onclick=()=>safe(()=>openTeam(item.team_id));$('teams').append(b)}if(list.length===1&&!invite)await openTeam(list[0].team_id)}
async function openTeam(id){team=await get(db.from('teams').select('*').eq('id',id).single());show('setup',false);show('app',true);$('teamtitle').textContent=team.name;show('copy',team.owner_id===me.id);const members=await get(db.from('members').select('user_id,display_name,role').eq('team_id',id));names=Object.fromEntries(members.map(m=>[m.user_id,m.display_name]));$('members').replaceChildren();for(const m of members){const b=document.createElement('button');b.textContent=m.display_name+(m.role==='owner'?' ★':'');b.onclick=()=>safe(async()=>{if(m.user_id===me.id)return;const rid=await get(db.rpc('create_dm',{p_team:id,p_other:m.user_id}));await openRoom(rid,'Чат с '+m.display_name)});$('members').append(b)}
const rooms=await get(db.from('rooms').select('id,name,kind').eq('team_id',id));$('rooms').replaceChildren();for(const r of rooms){if(r.kind==='dm'){const ms=await get(db.from('room_members').select('user_id').eq('room_id',r.id));if(!ms.some(x=>x.user_id===me.id))continue}const b=document.createElement('button');b.textContent=r.kind==='general'?r.name:'Личный чат';b.onclick=()=>safe(()=>openRoom(r.id,b.textContent));$('rooms').append(b)}const general=rooms.find(r=>r.kind==='general');if(general)await openRoom(general.id,general.name)}
async function openRoom(id,title){room=id;$('roomtitle').textContent=title;await messages()}
async function messages(){if(!room)return;const id=room;const rows=await get(db.from('messages').select('id,body,sender_id,created_at').eq('room_id',id).order('created_at',{ascending:false}).limit(100));if(room!==id)return;const box=$('chat');const old=seen.get(id);box.replaceChildren();for(const m of [...rows].reverse()){const p=document.createElement('div');p.className='msg'+(m.sender_id===me.id?' own':'');const s=document.createElement('small');s.textContent=(names[m.sender_id]||'Сотрудник')+' · '+new Date(m.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});p.append(s,document.createTextNode(m.body));if(m.sender_id===me.id){const actions=document.createElement('div');actions.className='row';const edit=document.createElement('button');edit.type='button';edit.textContent='✏️ Изменить';edit.onclick=()=>safe(async()=>{const next=prompt('Изменить сообщение',m.body);if(next===null||next.trim()===m.body)return;if(!next.trim()||next.length>4000){message('Сообщение должно содержать от 1 до 4000 символов');return}await get(db.from('messages').update({body:next.trim()}).eq('id',m.id).eq('sender_id',me.id));await messages()});const del=document.createElement('button');del.type='button';del.textContent='🗑 Удалить';del.onclick=()=>safe(async()=>{if(!confirm('Удалить сообщение?'))return;await get(db.from('messages').delete().eq('id',m.id).eq('sender_id',me.id));await messages()});actions.append(edit,del);p.append(actions)}box.append(p)}box.scrollTop=box.scrollHeight;const newest=rows[0];if(newest&&old&&newest.id!==old&&newest.sender_id!==me.id&&Notification.permission==='granted')new Notification('ТОЧКА: новое сообщение',{body:(names[newest.sender_id]||'Сотрудник')+': '+newest.body.slice(0,80)});if(newest)seen.set(id,newest.id)}
setInterval(()=>{if(me&&room&&!busy){busy=true;messages().catch(console.warn).finally(()=>busy=false)}},6000);
await refresh().catch(e=>message(e.message));
</script></html>
