<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТОЧКА</title><meta name="app-version" content="push-toggle-5"><meta name="theme-color" content="#0e1625"><link rel="manifest" href="/manifest.webmanifest"><style>body{margin:0;background:#0e1625;color:#eef3ff;font:16px system-ui}main{max-width:940px;margin:auto;padding:18px}button{background:#537cff;border:0;border-radius:10px;color:white;padding:12px;cursor:pointer}input{background:#263349;color:white;border:1px solid #48566d;border-radius:10px;padding:12px;min-width:0}section{background:#1a2536;border-radius:18px;padding:20px;margin:14px 0}#chat{height:48vh;overflow:auto;background:#101a2b;padding:10px;border-radius:12px}.msg{background:#2c3e54;border-radius:12px;padding:10px;margin:9px 0;overflow-wrap:anywhere}.own{background:#214a85;margin-left:18%}.msg small{display:block;opacity:.7}.msg .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}.msg .actions button{padding:5px 8px;background:#425675;font-size:12px}.msg em{opacity:.55;font-size:12px}#rooms button,#members button{margin:4px}#notify{display:inline-flex;align-items:center;gap:8px}#notify[data-active="false"]{background:#45536a;color:#e1e8f2}#notify .bell{font-size:24px;line-height:1}.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1}.error{color:#ffb0b0}#app{display:grid;grid-template-columns:1fr 2fr;gap:12px}@media(max-width:650px){#app{grid-template-columns:1fr}main{padding:10px}section{padding:14px}}</style><main><header class="row"><h1>● ТОЧКА</h1><button id="logout" class="hidden">Выйти</button></header><p>Чат сотрудников · подключение без прямых запросов к Supabase</p><section id="auth"><h2>Вход / регистрация</h2><div class="row"><input id="email" placeholder="Email" type="email"><input id="password" placeholder="Пароль" type="password"><input id="nickname" placeholder="Ваше имя"></div><p class="row"><button id="login">Войти</button><button id="signup">Регистрация</button></p></section><section id="setup" class="hidden"><h2>Мои команды</h2><div id="teams"></div><div id="joinbox" class="hidden"><p>Вас пригласили в команду</p><button id="join">Присоединиться</button></div><div class="row"><input id="teamname" placeholder="Название команды"><button id="create">Создать команду</button></div></section><div id="app" class="hidden"><section><h2 id="teamtitle"></h2><button id="copy">Скопировать приглашение</button><h3>Чаты</h3><div id="rooms"></div><h3>Сотрудники</h3><div id="members"></div><button id="notify" data-active="false" aria-pressed="false"><span class="bell" aria-hidden="true">🔕</span><span class="bell-label">Уведомления выключены</span></button></section><section><h2 id="roomtitle">Общий чат</h2><div id="chat"></div><form class="row" id="send"><input id="message" placeholder="Сообщение..." maxlength="4000" required><button>Отправить</button></form></section></div><p id="status" class="error" role="status"></p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const origin='https://tmumiyekzgafawxdwgxm.supabase.co';
const proxy=(input,init={})=>{const url=new URL(typeof input==='string'?input:input.url);if(url.origin!==origin)throw Error('Запрос к неизвестному серверу');return fetch('/api/gateway?path='+encodeURIComponent(url.pathname+url.search),init)};
const db=createClient(origin,'sb_publishable_xrQK9pXy3KTvazSmbHScGg_QvHyScNw',{global:{fetch:proxy},auth:{detectSessionInUrl:true}});
const $=id=>document.getElementById(id),show=(id,yes)=>$(id).classList.toggle('hidden',!yes),message=s=>$('status').textContent=s||'';
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(console.warn);let pushBusy=false;
async function pushSubscription(){if(!('serviceWorker' in navigator)||!('PushManager' in window))return null;const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('Service Worker не отвечает')),5000))]);return reg.pushManager.getSubscription()}
async function updatePushButton(){const btn=$('notify');let active=false;if(me&&'Notification' in window&&Notification.permission==='granted'){try{const sub=await pushSubscription();active=!!sub&&localStorage.getItem('tochka_push_off')!=='1'}catch{}}btn.dataset.active=String(active);btn.setAttribute('aria-pressed',String(active));btn.querySelector('.bell').textContent=active?'🔔':'🔕';btn.querySelector('.bell-label').textContent=active?'Уведомления включены':'Уведомления выключены'}
async function enablePush(requestConsent=true){
 if(!me)throw Error('Сначала войди в аккаунт');
 if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window))throw Error('Этот браузер не поддерживает push');
 // Permission must be requested before the first await, otherwise Chrome can lose user activation.
 const permissionPromise=Notification.permission==='granted'?Promise.resolve('granted'):(requestConsent&&Notification.permission!=='denied'?Notification.requestPermission():Promise.resolve(Notification.permission));
 const permission=await permissionPromise;
 if(permission!=='granted')throw Error('Уведомления запрещены в Chrome. Разреши их в настройках сайта');
 const response=await fetch('/api/push-config',{cache:'no-store'});
 if(!response.ok)throw Error('Ошибка сервера уведомлений: '+response.status);
 const config=await response.json();if(!config.publicKey)throw Error('На сервере отсутствует VAPID_PUBLIC_KEY');
 const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('Service Worker не отвечает')),8000))]);
 const decode=v=>Uint8Array.from(atob(v.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 let sub=await reg.pushManager.getSubscription();
 if(sub){const old=sub.options?.applicationServerKey;if(old&&Array.from(new Uint8Array(old)).join(',')!==Array.from(decode(config.publicKey)).join(',')){await sub.unsubscribe();sub=null}}
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decode(config.publicKey)});
 const data=sub.toJSON();
 try{await get(db.from('push_subscriptions').upsert({endpoint:data.endpoint,user_id:me.id,p256dh:data.keys.p256dh,auth_secret:data.keys.auth},{onConflict:'endpoint'}))}
 catch(e){throw Error('Не удалось сохранить подписку: '+(e.message||e))}
 localStorage.removeItem('tochka_push_off');await updatePushButton();
}
async function togglePush(){
 if(pushBusy)return;pushBusy=true;const btn=$('notify');btn.disabled=true;
 const label=btn.querySelector('.bell-label');if(label)label.textContent='Проверяю…';
 try{
  const sub=await pushSubscription();
  if(sub&&localStorage.getItem('tochka_push_off')!=='1'){
   await get(db.from('push_subscriptions').delete().eq('endpoint',sub.endpoint).eq('user_id',me.id));
   await sub.unsubscribe();localStorage.setItem('tochka_push_off','1');message('Уведомления отключены');
  }else{
   await enablePush(true);message('Уведомления включены');
  }
 }catch(e){message('Ошибка уведомлений: '+(e.message||String(e)))}
 finally{pushBusy=false;btn.disabled=false;await updatePushButton()}
}
const invite=new URLSearchParams(location.search).get('invite');let me,team,room,names={},seen=new Map(),busy=false;
async function get(p){const {data,error}=await p;if(error)throw error;return data}
async function safe(fn){try{message('');await fn()}catch(e){message(e.message||String(e))}}
$('signup').onclick=()=>safe(async()=>{await get(db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:location.origin+'/',data:{display_name:$('nickname').value.trim()}}}));message('Проверьте почту и подтвердите адрес, затем войдите')});
$('login').onclick=()=>safe(async()=>{await get(db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}));await refresh()});
$('logout').onclick=()=>safe(async()=>{await db.auth.signOut();location.reload()});
$('create').onclick=()=>safe(async()=>{const id=await get(db.rpc('create_team',{p_name:$('teamname').value.trim(),p_display_name:$('nickname').value.trim()||me.user_metadata?.display_name||'Сотрудник'}));await openTeam(id)});
$('join').onclick=()=>safe(async()=>{const id=await get(db.rpc('join_team',{p_token:invite,p_display_name:$('nickname').value.trim()||me.user_metadata?.display_name||'Сотрудник'}));history.replaceState({},'',location.pathname);await openTeam(id)});
$('copy').onclick=()=>safe(async()=>{const link=location.origin+location.pathname+'?invite='+team.invite_token;await navigator.clipboard.writeText(link);message('Ссылка скопирована')});
$('notify').onclick=()=>safe(togglePush);
$('send').onsubmit=e=>{e.preventDefault();safe(async()=>{const body=$('message').value.trim();if(!body)return;const saved=await get(db.from('messages').insert({room_id:room,sender_id:me.id,body}).select('id').single());fetch('/api/push-send',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+(await db.auth.getSession()).data.session.access_token},body:JSON.stringify({message_id:saved.id})}).catch(console.warn);$('message').value='';await messages()})};
async function refresh(){me=(await db.auth.getUser()).data.user;show('auth',!me);show('setup',!!me);show('logout',!!me);show('joinbox',!!me&&!!invite);if(!me)return;updatePushButton().catch(console.warn);if('Notification' in window&&Notification.permission==='granted'&&localStorage.getItem('tochka_push_off')!=='1')enablePush(false).catch(e=>console.warn('Push auto-setup:',e));const list=await get(db.from('members').select('team_id,teams(name)').eq('user_id',me.id));$('teams').replaceChildren();for(const item of list){const b=document.createElement('button');b.textContent=item.teams?.name||'Команда';b.onclick=()=>safe(()=>openTeam(item.team_id));$('teams').append(b)}if(list.length===1&&!invite)await openTeam(list[0].team_id)}
async function openTeam(id){team=await get(db.from('teams').select('*').eq('id',id).single());show('setup',false);show('app',true);$('teamtitle').textContent=team.name;show('copy',team.owner_id===me.id);const members=await get(db.from('members').select('user_id,display_name,role').eq('team_id',id));names=Object.fromEntries(members.map(m=>[m.user_id,m.display_name]));$('members').replaceChildren();for(const m of members){const b=document.createElement('button');b.textContent=m.display_name+(m.role==='owner'?' ★':'');b.onclick=()=>safe(async()=>{if(m.user_id===me.id)return;const rid=await get(db.rpc('create_dm',{p_team:id,p_other:m.user_id}));await openRoom(rid,'Чат с '+m.display_name)});$('members').append(b)}
const rooms=await get(db.from('rooms').select('id,name,kind').eq('team_id',id));$('rooms').replaceChildren();for(const r of rooms){if(r.kind==='dm'){const ms=await get(db.from('room_members').select('user_id').eq('room_id',r.id));if(!ms.some(x=>x.user_id===me.id))continue}const b=document.createElement('button');b.textContent=r.kind==='general'?r.name:'Личный чат';b.onclick=()=>safe(()=>openRoom(r.id,b.textContent));$('rooms').append(b)}const general=rooms.find(r=>r.kind==='general');if(general)await openRoom(general.id,general.name)}
async function openRoom(id,title){document.title='ТОЧКА';room=id;$('roomtitle').textContent=title;await messages()}
async function messages(){if(!room)return;const id=room;const rows=await get(db.from('messages').select('id,body,sender_id,created_at,edited_at').eq('room_id',id).order('created_at',{ascending:false}).limit(100));if(room!==id)return;const box=$('chat');const old=seen.get(id);box.replaceChildren();for(const m of [...rows].reverse()){const p=document.createElement('div');p.className='msg'+(m.sender_id===me.id?' own':'');const s=document.createElement('small');s.textContent=(names[m.sender_id]||'Сотрудник')+' · '+new Date(m.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});p.append(s,document.createTextNode(m.body));if(m.sender_id===me.id){const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.textContent='✎ Изменить';edit.onclick=()=>safe(async()=>{const body=prompt('Изменить своё сообщение',m.body);if(body===null||body===m.body)return;if(!body.trim()||body.length>4000)throw Error('Текст должен содержать от 1 до 4000 символов');await get(db.from('messages').update({body:body.trim(),edited_at:new Date().toISOString()}).eq('id',m.id).eq('sender_id',me.id));await messages()});const del=document.createElement('button');del.textContent='🗑 Удалить';del.onclick=()=>safe(async()=>{if(!confirm('Удалить своё сообщение?'))return;await get(db.from('messages').delete().eq('id',m.id).eq('sender_id',me.id));await messages()});actions.append(edit,del);p.append(actions)}if(m.edited_at){const tag=document.createElement('em');tag.textContent=' · изменено';p.append(tag)}box.append(p)}box.scrollTop=box.scrollHeight;const newest=rows[0];if(newest&&old&&newest.id!==old&&newest.sender_id!==me.id){const body=(names[newest.sender_id]||'Сотрудник')+': '+newest.body.slice(0,80);if(Notification.permission==='granted'&&localStorage.getItem('tochka_push_off')!=='1'){if(navigator.serviceWorker?.controller){navigator.serviceWorker.ready.then(reg=>reg.showNotification('ТОЧКА: новое сообщение',{body,tag:'tochka-'+id,data:{url:location.href}})).catch(console.warn)}else new Notification('ТОЧКА: новое сообщение',{body})}if(document.hidden)document.title='● Новое сообщение · ТОЧКА'}if(newest)seen.set(id,newest.id)}
setInterval(()=>{if(me&&room&&!busy){busy=true;messages().catch(console.warn).finally(()=>busy=false)}},6000);
await refresh().catch(e=>message(e.message));
</script></html>
